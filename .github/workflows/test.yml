name: build-and-test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go test -short ./...
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -short -race ./...
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/training -p 'test_*.py'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax and Go formatting
        if: runner.os == 'Linux'
        run: |
          for file in internal/webserver/static/js/*.js internal/webserver/static/vendor/*.js; do node --check "$file"; done
          test -z "$(gofmt -l cmd internal)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Browser regression tests
        if: runner.os == 'Linux'
        run: go test ./internal/webserver -run TestBrowser -v
      - run: go vet ./...
      - run: go build -trimpath ./cmd/offcode

      - name: Check Windows installer and setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/scripts/windows/install.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item offcode.exe bin/offcode.exe
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=0.2.2 scripts/windows/offcode.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          & ./scripts/windows/install.ps1 -LocalExe ./offcode.exe -Models none -Ollama preserve -Preserve server -Updates off -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell installation/setup failed' }
          $settings = Get-Content "$env:USERPROFILE/.offcode/setup.json" -Raw | ConvertFrom-Json
          if (@($settings.preserve).Count -ne 1 -or $settings.preserve[0] -ne 'server') { throw 'Preservation checkbox selection was not forwarded' }
          & "$env:LOCALAPPDATA/Programs/offcode/offcode.exe" version
          if ($LASTEXITCODE -ne 0) { throw 'Installed executable failed' }
          & ./scripts/windows/install.ps1 -Uninstall
