name: release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -short ./...
      - run: go vet ./...
      - run: go build -trimpath -ldflags "-X github.com/Johnny008-creator/offcode/internal/tui.AppVersion=${GITHUB_REF_NAME#v}" -o dist/offcode-linux-amd64 ./cmd/offcode
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offcode-linux-amd64
          path: dist/offcode-linux-amd64

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -short ./...
      - run: go vet ./...
      - name: Build offcode.exe
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          go build -trimpath -ldflags "-X github.com/Johnny008-creator/offcode/internal/tui.AppVersion=$version" -o bin\offcode.exe .\cmd\offcode
      - name: Derive version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT
      - name: Compile installer (Inno Setup, preinstalled on windows-latest)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=${{ steps.ver.outputs.version }} `
            scripts\windows\offcode.iss
      - name: Rename raw exe for the release asset list
        shell: pwsh
        run: Copy-Item bin\offcode.exe dist\offcode-windows-amd64.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offcode-windows-amd64
          path: |
            dist\offcode-windows-amd64.exe
            dist\offcode-setup-*.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Package dependency notices
        run: tar -czf artifacts/offcode-notices.tar.gz THIRD_PARTY_NOTICES.md LICENSING.md docs/licenses
      - name: Generate release checksums
        shell: bash
        run: |
          cd artifacts
          find . -type f -name 'offcode*' -exec sh -c 'cd "$(dirname "$1")" && sha256sum "$(basename "$1")"' sh {} \; > SHA256SUMS
      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/SHA256SUMS
            artifacts/offcode-notices.tar.gz
            artifacts/offcode-linux-amd64/offcode-linux-amd64
            artifacts/offcode-windows-amd64/offcode-windows-amd64.exe
            artifacts/offcode-windows-amd64/offcode-setup-*.exe
          generate_release_notes: true
